name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: folder
          POSTGRES_PASSWORD: folder
          POSTGRES_DB: folder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          # Enables the Postgres-backed indexer tests (idempotency, atomic cursor).
          TEST_DATABASE_URL: postgresql://folder:folder@localhost:5432/folder_test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify compiled entrypoints import
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://folder:folder@localhost:5432/folder_test
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          FOLDER_CONTRACT_ID: CDDQK74SMH4RB4HYLHM6BYZPTAMDMRISHW5Q274KADVZVFD57K43O6KV
          IPFS_API_URL: http://localhost:5001
          IPFS_GATEWAY: https://ipfs.io/ipfs
        run: node -e "require('./dist/app'); require('./dist/indexer/stellar'); require('./dist/db/migrate')"

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/Dockerfile -t folder-indexer-backend:ci .

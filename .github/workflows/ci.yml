name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: folder
          POSTGRES_PASSWORD: folder
          POSTGRES_DB: folder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kubo:
        # Keep in sync with deploy/docker-compose.yml (pinned Kubo version).
        image: ipfs/kubo:v0.30.0
        ports:
          - 5001:5001
        options: >-
          --health-cmd "ipfs id"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check generated config docs
        run: |
          npm run docs:config
          git diff --exit-code -- docs/configuration.md .env.example

      - name: Test
        env:
          # Enables the Postgres-backed indexer tests (idempotency, atomic cursor).
          TEST_DATABASE_URL: postgresql://folder:folder@localhost:5432/folder_test
          # Enables the IPFS integration tests that hit the real Kubo node above.
          IPFS_INTEGRATION: "1"
          IPFS_API_URL: http://localhost:5001
        run: npm test

      - name: Fuzz (short budget)
        env:
          # Reduced case count so PR builds stay fast; the nightly workflow runs the
          # longer budget. The fuzz test asserts >= 10,000 cases by default.
          FUZZ_CASES: '10000'
        run: npm run test:fuzz

      - name: Build
        run: npm run build

      - name: Verify bundled CLI entrypoint
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://folder:folder@localhost:5432/folder_test
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          FOLDER_CONTRACT_ID: CDDQK74SMH4RB4HYLHM6BYZPTAMDMRISHW5Q274KADVZVFD57K43O6KV
          IPFS_API_URL: http://localhost:5001
          IPFS_GATEWAY: https://ipfs.io/ipfs
        run: |
          node dist/indexer/cli.js --help
          node dist/indexer/cli.js status

      - name: Verify bundled API entrypoint
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://folder:folder@localhost:5432/folder_test
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          FOLDER_CONTRACT_ID: CDDQK74SMH4RB4HYLHM6BYZPTAMDMRISHW5Q274KADVZVFD57K43O6KV
          IPFS_API_URL: http://localhost:5001
          IPFS_GATEWAY: https://ipfs.io/ipfs
          PORT: "3000"
        run: |
          node dist/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "Healthcheck passed"
              kill "$SERVER_PID"
              exit 0
            fi
            sleep 1
          done
          echo "Healthcheck failed" >&2
          kill "$SERVER_PID" || true
          exit 1

  # Runs the test suite through PgBouncer in transaction pooling mode, as
  # managed Postgres deployments commonly do. Pooled tests use TEST_DATABASE_URL
  # (PgBouncer); session-required work (migrations, LISTEN) uses
  # TEST_DATABASE_DIRECT_URL. See docs/operations.md#connection-pooling-pgbouncer.
  pgbouncer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: folder
          POSTGRES_PASSWORD: folder
          POSTGRES_DB: folder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pgbouncer:
        # Keep in sync with the `pgbouncer` profile in deploy/docker-compose.yml.
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_USER: folder
          DB_PASSWORD: folder
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_PREPARED_STATEMENTS: '0'
          MAX_CLIENT_CONN: '200'
          DEFAULT_POOL_SIZE: '10'
        ports:
          - 6432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Wait for PgBouncer
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 6432 -U folder; then exit 0; fi
            sleep 2
          done
          echo "PgBouncer did not become ready" >&2
          exit 1

      - name: Test through PgBouncer (transaction pooling)
        env:
          TEST_DATABASE_URL: postgresql://folder:folder@localhost:6432/folder_test
          TEST_DATABASE_DIRECT_URL: postgresql://folder:folder@localhost:5432/folder_test
          DATABASE_DIRECT_URL: postgresql://folder:folder@localhost:5432/folder_test
        run: npm test

  schema-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: folder
          POSTGRES_PASSWORD: folder
          POSTGRES_DB: folder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags so the script can find the latest release tag.
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify schema upgrades from previous release
        env:
          TEST_DATABASE_URL: postgresql://folder:folder@localhost:5432/folder_test
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: folder
          PGPASSWORD: folder
        run: sh scripts/schema-upgrade-check.sh

  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dev container image
        run: docker build -f .devcontainer/Dockerfile -t folder-indexer-devcontainer:ci .devcontainer

  e2e:
    runs-on: ubuntu-latest
    needs: check
    # Keep the job under ~10 minutes: quickstart image and contract artifacts are cached.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: folder
          POSTGRES_PASSWORD: folder
          POSTGRES_DB: folder_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Contract version is pinned in scripts/e2e/contract-version.env (single source of truth).
      E2E_CONTRACT_VERSION_FILE: scripts/e2e/contract-version.env
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/.e2e-artifacts
      TEST_DATABASE_URL: postgresql://folder:folder@localhost:5432/folder_e2e
      DATABASE_URL: postgresql://folder:folder@localhost:5432/folder_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Read pinned contract version
        id: contract
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$E2E_CONTRACT_VERSION_FILE"
          echo "version=${FOLDER_CONTRACT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "wasm_url=${FOLDER_CONTRACT_WASM_URL}" >> "$GITHUB_OUTPUT"
          echo "wasm_sha256=${FOLDER_CONTRACT_WASM_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Cache quickstart image
        id: quickstart-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.E2E_ARTIFACTS_DIR }}/quickstart-image.tar
          key: quickstart-image-${{ runner.os }}-${{ hashFiles('scripts/e2e/quickstart-image.env') }}

      - name: Load or pull quickstart image
        run: |
          set -euo pipefail
          mkdir -p "$E2E_ARTIFACTS_DIR"
          if [ -f "$E2E_ARTIFACTS_DIR/quickstart-image.tar" ]; then
            docker load -i "$E2E_ARTIFACTS_DIR/quickstart-image.tar"
          else
            # shellcheck disable=SC1091
            source scripts/e2e/quickstart-image.env
            docker pull "$QUICKSTART_IMAGE"
            docker save "$QUICKSTART_IMAGE" -o "$E2E_ARTIFACTS_DIR/quickstart-image.tar"
          fi

      - name: Cache contract wasm
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.E2E_ARTIFACTS_DIR }}/folder-contract.wasm
          key: folder-contract-${{ steps.contract.outputs.version }}-${{ steps.contract.outputs.wasm_sha256 }}

      - name: Download and verify contract wasm
        run: |
          set -euo pipefail
          mkdir -p "$E2E_ARTIFACTS_DIR"
          WASM="$E2E_ARTIFACTS_DIR/folder-contract.wasm"
          if [ ! -f "$WASM" ]; then
            curl -fsSL "${{ steps.contract.outputs.wasm_url }}" -o "$WASM"
          fi
          echo "${{ steps.contract.outputs.wasm_sha256 }}  $WASM" | sha256sum -c -

      - name: Start quickstart network
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/e2e/quickstart-image.env
          docker run -d --name stellar-quickstart \
            -p 8000:8000 \
            -e NETWORK=local \
            -e ENABLE_SOROBAN_RPC=true \
            "$QUICKSTART_IMAGE"
          scripts/e2e/wait-for-rpc.sh

      - name: Run e2e scenario
        env:
          STELLAR_RPC_URL: http://localhost:8000/soroban/rpc
          STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
          FOLDER_CONTRACT_WASM: ${{ env.E2E_ARTIFACTS_DIR }}/folder-contract.wasm
        run: npm run test:e2e

      - name: Dump quickstart logs on failure
        if: failure()
        run: docker logs stellar-quickstart || true

  docker:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/Dockerfile -t folder-indexer-backend:ci .

      - name: Smoke test graceful shutdown (API and indexer)
        env:
          DATABASE_URL: postgresql://folder:folder@localhost:5432/folder_test
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          FOLDER_CONTRACT_ID: CDDQK74SMH4RB4HYLHM6BYZPTAMDMRISHW5Q274KADVZVFD57K43O6KV
          IPFS_API_URL: http://localhost:5001
          IPFS_GATEWAY: https://ipfs.io/ipfs
        run: |
          set -euo pipefail
          for target in api indexer; do
            if [ "$target" = "api" ]; then
              cmd="node dist/server.js"
            else
              cmd="node dist/indexer/main.js"
            fi
            cid=$(docker run -d --name "smoke-$target" \
              -e DATABASE_URL -e STELLAR_RPC_URL -e FOLDER_CONTRACT_ID \
              -e IPFS_API_URL -e IPFS_GATEWAY \
              folder-indexer-backend:ci $cmd)
            # Give the process time to register signal handlers.
            sleep 5
            start=$(date +%s)
            docker stop --time 30 "$cid" >/dev/null
            elapsed=$(( $(date +%s) - start ))
            code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
            docker rm "$cid" >/dev/null
            echo "$target exited with code $code after ${elapsed}s"
            if [ "$code" -ne 0 ]; then
              echo "::error::$target did not exit gracefully (code $code)"
              exit 1
            fi
            if [ "$elapsed" -ge 30 ]; then
              echo "::error::$target did not shut down before the kill timeout"
              exit 1
            fi
          done

      - name: Smoke test no zombie processes
        env:
          DATABASE_URL: postgresql://folder:folder@localhost:5432/folder_test
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          FOLDER_CONTRACT_ID: CDDQK74SMH4RB4HYLHM6BYZPTAMDMRISHW5Q274KADVZVFD57K43O6KV
          IPFS_API_URL: http://localhost:5001
          IPFS_GATEWAY: https://ipfs.io/ipfs
        run: |
          set -euo pipefail
          cid=$(docker run -d --name smoke-zombies \
            -e DATABASE_URL -e STELLAR_RPC_URL -e FOLDER_CONTRACT_ID \
            -e IPFS_API_URL -e IPFS_GATEWAY \
            folder-indexer-backend:ci node dist/server.js)
          sleep 5
          for i in $(seq 1 10); do
            docker exec smoke-zombies sh -c 'true' >/dev/null 2>&1 || true
          done
          zombies=$(docker exec smoke-zombies sh -c \
            'ps -eo stat 2>/dev/null | grep -c "^Z" || true' | tr -d '[:space:]')
          docker stop --time 30 "$cid" >/dev/null
          docker rm "$cid" >/dev/null
          echo "zombie process count: ${zombies:-0}"
          if [ "${zombies:-0}" -ne 0 ]; then
            echo "::error::zombie processes accumulated (${zombies})"
            exit 1
          fi
